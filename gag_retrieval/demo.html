<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>AIDJ 有梗接歌 Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --panel2: #f1f3f5; --line: #e2e5e9;
    --txt: #1c2128; --dim: #67707c; --acc: #0e7a5f; --acc2: #1f5eff;
    --warn: #9a6700; --bad: #b42334;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--txt);
         font: 15px/1.55 "PingFang TC", "Noto Sans TC", sans-serif; }
  header { padding: 14px 22px; border-bottom: 1px solid var(--line);
           display: flex; align-items: baseline; gap: 14px;
           background: var(--panel); }
  header h1 { font-size: 19px; margin: 0; letter-spacing: 1px; }
  header .sub { color: var(--dim); font-size: 13px; }
  .wrap { display: flex; min-height: calc(100vh - 54px); }

  /* sidebar */
  aside { width: 250px; border-right: 1px solid var(--line); padding: 14px; }
  aside h2 { font-size: 12px; color: var(--dim); text-transform: uppercase;
             letter-spacing: 2px; margin: 4px 0 10px; }
  .song { padding: 9px 11px; border-radius: 9px; cursor: pointer;
          border: 1px solid transparent; margin-bottom: 6px; }
  .song:hover { background: var(--panel); }
  .song.sel { background: var(--panel2); border-color: var(--acc); }
  .song.played { opacity: .38; pointer-events: none; }
  .song .t { font-weight: 600; }
  .song .m { color: var(--dim); font-size: 12px; }

  /* main */
  main { flex: 1; padding: 18px 26px; max-width: 980px; }
  .nowbar { background: var(--panel); border: 1px solid var(--line);
            border-radius: 14px; padding: 14px 18px; display: flex;
            align-items: center; gap: 16px; flex-wrap: wrap;
            box-shadow: 0 1px 3px rgba(16,24,40,.05); }
  .nowbar .label { color: var(--dim); font-size: 12px; letter-spacing: 2px; }
  .nowbar .title { font-size: 21px; font-weight: 700; }
  .nowbar audio { flex: 1; min-width: 260px; height: 36px; }
  #chain { color: var(--dim); font-size: 13px; margin: 10px 2px; }
  #chain b { color: var(--acc); }

  button.retrieve { background: var(--acc); color: #fff; border: 0;
    font-size: 16px; font-weight: 800; letter-spacing: 2px;
    padding: 11px 30px; border-radius: 10px; cursor: pointer; }
  button.retrieve:disabled { opacity: .4; cursor: wait; }
  button.mini { background: var(--panel2); color: var(--txt);
    border: 1px solid var(--line); border-radius: 7px; padding: 3px 10px;
    cursor: pointer; font-size: 12px; }
  button.mini:hover { border-color: var(--acc2); }

  .play { background: none; border: 1px solid var(--line); color: var(--acc);
    border-radius: 50%; width: 26px; height: 26px; cursor: pointer;
    font-size: 12px; line-height: 1; vertical-align: -2px; }
  .play:hover { border-color: var(--acc); }
  .play.on { background: var(--acc); color: #fff; }

  /* judge card */
  .judge { border: 1px solid var(--acc); background: #f4faf8;
    border-radius: 14px; padding: 16px 20px; margin: 18px 0; }
  .judge h3 { margin: 0 0 10px; font-size: 13px; color: var(--acc);
              letter-spacing: 2px; }
  .verdict { font-size: 18px; margin-bottom: 8px; }
  .verdict .anchor { color: var(--acc); font-weight: 800; }
  .why { color: var(--dim); }
  .conf { display: inline-block; border-radius: 6px; padding: 1px 9px;
          font-size: 12px; font-weight: 700; margin-left: 8px; }
  .conf.高 { background: #dcf3ea; color: var(--acc); }
  .conf.中 { background: #f6ecd4; color: var(--warn); }
  .conf.低 { background: #fbe3e6; color: var(--bad); }
  .jline { margin: 6px 0; }
  .jline .time { color: var(--acc2); font-family: ui-monospace, monospace;
                 font-size: 13px; margin: 0 6px; }
  .runner { color: var(--dim); font-size: 13px; margin-top: 10px;
            border-top: 1px dashed var(--line); padding-top: 8px; }
  .spin { color: var(--dim); }
  .spin::after { content: ""; display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--dim); border-top-color: transparent;
    border-radius: 50%; margin-left: 8px; vertical-align: -2px;
    animation: r 0.8s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }

  /* option cards */
  .cand { background: var(--panel); border: 1px solid var(--line);
          border-radius: 14px; padding: 14px 18px; margin: 14px 0;
          box-shadow: 0 1px 3px rgba(16,24,40,.05); }
  .cand .head { display: flex; align-items: center; gap: 12px;
                margin-bottom: 8px; flex-wrap: wrap; }
  .cand .head .bt { font-size: 18px; font-weight: 800; }
  .scorebar { height: 6px; width: 120px; background: var(--panel2);
              border-radius: 3px; overflow: hidden; }
  .scorebar i { display: block; height: 100%; background: var(--acc2); }
  .ev { border-top: 1px solid var(--line); padding: 9px 0; }
  .ev .row { display: flex; gap: 8px; align-items: baseline; }
  .ev .who { color: var(--dim); font-size: 12px; width: 18px; flex: none; }
  .ev .time { color: var(--acc2); font-family: ui-monospace, monospace;
              font-size: 12.5px; flex: none; width: 66px; }
  .chip { display: inline-block; background: var(--panel2); color: var(--dim);
    border-radius: 6px; padding: 0 8px; font-size: 11.5px; margin-right: 6px; }
  .chip.anchor { color: var(--acc); font-weight: 700; font-size: 12.5px; }
  .chip.recog { color: var(--warn); }
  .meta { color: var(--dim); font-size: 12px; margin-top: 3px;
          padding-left: 26px; }
  .empty { color: var(--dim); padding: 30px; text-align: center; }

  /* mix preview */
  button.mixbtn { background: var(--acc2); color: #fff; border: 0;
    border-radius: 8px; padding: 5px 14px; font-weight: 700; cursor: pointer;
    font-size: 13px; }
  button.mixbtn.small { padding: 2px 10px; font-size: 11.5px; }
  button.mixbtn.on { background: var(--acc); color: #fff; }
  #mixbar { position: sticky; bottom: 0; background: var(--panel);
    border-top: 2px solid var(--acc); padding: 10px 26px; display: none;
    align-items: center; gap: 14px; font-size: 14px; z-index: 5;
    box-shadow: 0 -4px 16px rgba(0,0,0,.06); }
  #mixbar.show { display: flex; }
  #mixbar .phase { color: var(--acc); font-weight: 800; letter-spacing: 1px;
    flex: none; }
  #mixbar .detail { color: var(--txt); flex: 1; }
  #mixbar .detail .time { color: var(--acc2);
    font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<header>
  <h1>AIDJ 有梗接歌</h1>
  <span class="sub">字面對應檢索（Stage 1）＋ LLM 裁判（Stage 2）— 每句可試聽</span>
</header>
<div class="wrap">
  <aside>
    <h2>曲庫</h2>
    <div id="songs"></div>
  </aside>
  <main>
    <div class="nowbar">
      <div>
        <div class="label">NOW PLAYING</div>
        <div class="title" id="nowTitle">← 先從曲庫選一首</div>
      </div>
      <audio id="deck" controls preload="none"></audio>
      <button class="mini" id="calBtn" style="display:none"
              onclick="toggleCal()">校準</button>
      <button class="retrieve" id="go" disabled onclick="doRetrieve()">RETRIEVE ▶</button>
    </div>
    <div id="calPanel" style="display:none; background:var(--panel);
         border:1px solid var(--warn); border-radius:12px; padding:12px 16px;
         margin-top:10px; font-size:14px">
      <div style="color:var(--warn); font-size:12px; letter-spacing:2px;
           margin-bottom:6px">音檔時間校準 — <span id="calSong"></span>
           （每顆音檔的偏移各自獨立，接歌的 A、B 兩首都要校準）</div>
      <div>按 ▶ 應該聽到：「<span id="calText"></span>」——沒對上就調偏移，對上再儲存。</div>
      <div style="margin-top:8px; display:flex; align-items:center; gap:8px">
        <button class="play" onclick="calPlay(this)">▶</button>
        <button class="mini" onclick="calAdj(-1)">-1s</button>
        <button class="mini" onclick="calAdj(-0.2)">-0.2s</button>
        <span style="font-family:ui-monospace,monospace" id="calOff">+0.0s</span>
        <button class="mini" onclick="calAdj(0.2)">+0.2s</button>
        <button class="mini" onclick="calAdj(1)">+1s</button>
        <button class="mini" onclick="calSave()">儲存</button>
        <span id="calMsg" style="color:var(--dim); font-size:12px"></span>
      </div>
    </div>
    <div id="chain"></div>
    <div id="judge"></div>
    <div id="results"></div>
  </main>
</div>
<div id="mixbar">
  <span class="phase" id="mixPhase"></span>
  <span class="detail" id="mixDetail"></span>
  <button class="mini" onclick="stopMix()">停止</button>
</div>

<script>
let SONGS = [], NOW = null, PLAYED = [], preview = new Audio(), curBtn = null;
preview.preload = "none";
preview.addEventListener("pause", () => mark(null));

function esc(s) { return String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function mmss(t) { if (t == null) return "--:--";
  return String(Math.floor(t/60)).padStart(2,"0") + ":" +
         (t%60).toFixed(1).padStart(4,"0"); }
function mark(btn) {
  if (curBtn) curBtn.classList.remove("on");
  curBtn = btn; if (btn) btn.classList.add("on");
}
/* audio = LRC time + per-song offset (YouTube rips often carry extra intro;
   calibrate via the 校準 button, saved server-side to offsets.json) */
let OFFSETS = {};
function off(song) { return OFFSETS[song] || 0; }

function playAt(song, sec, btn) {
  stopMix();
  if (curBtn === btn && !preview.paused) { preview.pause(); return; }
  const src = "/audio/" + encodeURIComponent(song);
  if (!preview.src.endsWith(encodeURIComponent(song))) preview.src = src;
  preview.currentTime = Math.max(0, (sec || 0) + off(song));
  preview.play().then(() => mark(btn)).catch(e => alert("播放失敗: " + e));
}

/* ── transition preview: A plays its exit line TO THE END at full volume and
      is cut fast right after (nothing past the target line leaks); B slips in
      with a short fade that ends exactly ON its hook line, so the hook lands
      at full volume the moment A's line finishes ── */
let MIX = null;
const LEAD = 7;        // how much of A you hear before the cut
const PRE = 0.6;       // B fade-in length, ending right ON its hook line
const FADE_A = 1.0;    // A fast fade-out, starting AT its line end

function stopMix() {
  if (!MIX) return;
  clearInterval(MIX.timer);
  try { MIX.ga.gain.cancelScheduledValues(0); } catch (e) {}
  try { MIX.gb.gain.cancelScheduledValues(0); } catch (e) {}
  try { MIX.a.pause(); MIX.b.pause(); } catch (e) {}
  MIX = null;
  document.getElementById("mixbar").classList.remove("show");
  document.querySelectorAll(".mixbtn.on").forEach(b => b.classList.remove("on"));
}

function mixStatus(phase, detail) {
  document.getElementById("mixbar").classList.add("show");
  document.getElementById("mixPhase").textContent = phase;
  document.getElementById("mixDetail").innerHTML = detail;
}

function seekReady(audio, t) {
  /* Safari ignores currentTime set before metadata loads — wait, then seek,
     then wait for the seek to actually land. */
  return new Promise((resolve) => {
    const doSeek = () => {
      const done = () => resolve();
      audio.addEventListener("seeked", done, { once: true });
      audio.currentTime = t;
      setTimeout(done, 1500);              // fallback: don't hang forever
    };
    if (audio.readyState >= 1) doSeek();
    else {
      audio.addEventListener("loadedmetadata", doSeek, { once: true });
      audio.load();
      setTimeout(() => { if (audio.readyState < 1) resolve(); }, 4000);
    }
  });
}

function xfCurve(n, upward) {
  const c = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = i / (n - 1);
    c[i] = upward ? Math.sin(x * Math.PI / 2) : Math.cos(x * Math.PI / 2);
  }
  return c;
}

async function playMix(aId, cutEnd, bId, bIn, aText, bText, btn) {
  if (MIX && MIX.btn === btn) { stopMix(); return; }
  stopMix(); preview.pause();
  cutEnd = cutEnd + off(aId);            // LRC time -> this file's audio time
  bIn = Math.max(0, bIn + off(bId));
  const ctx = window._actx ||
    (window._actx = new (window.AudioContext || window.webkitAudioContext)());
  await ctx.resume();
  const a = new Audio("/audio/" + encodeURIComponent(aId));
  const b = new Audio("/audio/" + encodeURIComponent(bId));
  a.preload = b.preload = "auto";
  const ga = ctx.createGain(), gb = ctx.createGain();
  ctx.createMediaElementSource(a).connect(ga); ga.connect(ctx.destination);
  ctx.createMediaElementSource(b).connect(gb); gb.connect(ctx.destination);
  ga.gain.value = 1; gb.gain.value = 0;
  MIX = { a, b, ga, gb, ctx, btn, timer: null, phase: "A", fired: false };
  if (btn) btn.classList.add("on");
  mixStatus("LOADING", "載入兩首音檔中…");
  const bStart = Math.max(0, bIn - PRE);
  await Promise.all([seekReady(a, Math.max(0, cutEnd - LEAD)),
                     seekReady(b, bStart)]);
  if (!MIX || MIX.a !== a) return;         // user stopped during load
  try { await a.play(); } catch (e) { alert("播放失敗: " + e); stopMix(); return; }

  MIX.timer = setInterval(async () => {
    if (!MIX || MIX.a !== a) return;
    const aT = a.currentTime;
    if (MIX.phase === "A") {
      mixStatus("DECK A", `《${esc(aId)}》「${esc(aText)}」 <span class="time">` +
        `${mmss(aT)} → 切點 ${mmss(cutEnd)}</span>`);
      // fire PRE sec before A's line ends: B slips in with a short ramp that
      // completes exactly as the hook line starts; A stays at FULL volume
      // until its line ends, then gets cut fast (no next-line leak).
      if (!MIX.fired && aT >= cutEnd - PRE) {
        MIX.fired = true;
        MIX.phase = "X";
        const t = ctx.currentTime;
        try { await b.play(); } catch (e) {}
        gb.gain.setValueCurveAtTime(xfCurve(64, true), t, PRE);
        // start A's fade a hair BEFORE line_end (= next line's start), so the
        // next line's first syllable is already decaying, never at full volume
        const aFadeDelay = Math.max(0, cutEnd - 0.25 - aT);
        ga.gain.setValueAtTime(1, t + aFadeDelay);
        ga.gain.setValueCurveAtTime(xfCurve(64, false), t + aFadeDelay, FADE_A);
        setTimeout(() => {
          if (MIX && MIX.a === a) { a.pause(); MIX.phase = "B"; }
        }, (aFadeDelay + FADE_A) * 1000);
        mixStatus("CROSSFADE", `「${esc(aText)}」 ⇄ 「${esc(bText)}」`);
      }
    } else if (MIX.phase === "X") {
      mixStatus("CROSSFADE", `「${esc(aText)}」淡出 ⇄ 「${esc(bText)}」淡入`);
    } else if (MIX.phase === "B") {
      mixStatus("DECK B", `《${esc(bId)}》「${esc(bText)}」 <span class="time">` +
        `${mmss(b.currentTime)}</span> — 接歌完成，B 繼續播放`);
    }
  }, 60);
}
let MIXOPTS = [];   // avoids quoting lyrics inside onclick attributes
function mixbtn(aId, cutEnd, bId, bIn, aText, bText, small) {
  if (cutEnd == null || bIn == null || !bId) return "";
  MIXOPTS.push({ aId, cutEnd, bId, bIn, aText, bText });
  return `<button class="mixbtn${small ? " small" : ""}" ` +
    `onclick="playMixIdx(${MIXOPTS.length - 1}, this)">試聽接歌</button>`;
}
function playMixIdx(i, btn) {
  const o = MIXOPTS[i];
  playMix(o.aId, o.cutEnd, o.bId, o.bIn, o.aText, o.bText, btn);
}
function pbtn(song, sec) {
  return `<button class="play" onclick="playAt('${esc(song)}',${sec},this)">▶</button>`;
}

async function loadSongs() {
  SONGS = (await (await fetch("/api/songs")).json()).songs;
  SONGS.forEach(s => { OFFSETS[s.id] = s.offset || 0; });
  const el = document.getElementById("songs");
  el.innerHTML = SONGS.map(s => `
    <div class="song ${s.id===NOW?"sel":""} ${PLAYED.includes(s.id)?"played":""}"
         onclick="pick('${esc(s.id)}')">
      <div class="t">${esc(s.title)}${s.has_audio?"":"（無音檔）"}
        <span style="float:right; font-size:11px; color:var(--dim);
              text-decoration:underline" title="校準此音檔的時間偏移"
              onclick="event.stopPropagation(); calFor('${esc(s.id)}')">校準</span>
      </div>
      <div class="m">${s.n_lines} 句 · 人聲至 ${mmss(s.vocal_end)}${
        off(s.id) ? ` · 偏移${off(s.id) > 0 ? "+" : ""}${off(s.id)}s` : ""}</div>
    </div>`).join("");
}
function pick(id) {
  stopMix();
  NOW = id;
  document.getElementById("nowTitle").textContent = "《" + id + "》";
  document.getElementById("deck").src = "/audio/" + encodeURIComponent(id);
  document.getElementById("go").disabled = false;
  document.getElementById("calBtn").style.display = "";
  document.getElementById("calPanel").style.display = "none";
  document.getElementById("judge").innerHTML = "";
  document.getElementById("results").innerHTML = "";
  loadSongs();
  renderChain();
}
function renderChain() {
  document.getElementById("chain").innerHTML = PLAYED.length
    ? "串燒軌跡：" + PLAYED.map(esc).join(" → ") + " → <b>" + esc(NOW) + "</b>"
    : "";
}

async function doRetrieve() {
  const go = document.getElementById("go");
  go.disabled = true;
  stopMix();
  MIXOPTS = [];
  const ex = encodeURIComponent(PLAYED.join(","));
  document.getElementById("results").innerHTML =
    '<div class="empty spin">stage 1 檢索中</div>';
  document.getElementById("judge").innerHTML =
    '<div class="judge"><h3>STAGE 2 · GEMINI 裁判</h3><div class="spin">呼叫 Gemini 中（約 5–15 秒）</div></div>';
  try {
    const r = await (await fetch(`/api/suggest?song=${encodeURIComponent(NOW)}&k=8&exclude=${ex}`)).json();
    renderResults(r);
  } catch (e) {
    document.getElementById("results").innerHTML =
      `<div class="empty">stage 1 失敗：${esc(e)}</div>`;
  }
  try {
    const j = await (await fetch(`/api/judge?song=${encodeURIComponent(NOW)}&k=8&exclude=${ex}`)).json();
    renderJudge(j);
  } catch (e) {
    document.getElementById("judge").innerHTML =
      `<div class="judge"><h3>STAGE 2 · GEMINI 裁判</h3><div>失敗：${esc(e)}</div></div>`;
  }
  go.disabled = false;
}

function metaChips(m, prefix) {
  if (!m || m.runway == null && !m.section_pos) return "";
  const bits = [];
  if (m.section_pos) bits.push(m.section_pos +
      (m.to_section_end != null ? `（離段尾 ${m.to_section_end}s）` : ""));
  if (m.runway != null) bits.push(`剩餘 ${Math.round(m.runway)}s`);
  if (m.pos_pct != null) bits.push(`位於 ${Math.round(m.pos_pct*100)}%`);
  return `<div class="meta">${prefix}${bits.map(esc).join(" · ")}</div>`;
}

function renderResults(r) {
  if (r.error) {
    document.getElementById("results").innerHTML =
      `<div class="empty">${esc(r.error)}</div>`; return;
  }
  if (!r.results.length) {
    document.getElementById("results").innerHTML =
      '<div class="empty">沒有任何字面對應的候選</div>'; return;
  }
  const max = Math.max(...r.results.map(x => x.score), 0.01);
  document.getElementById("results").innerHTML = r.results.map(c => `
    <div class="cand">
      <div class="head">
        <span class="bt">《${esc(c.song_id)}》</span>
        <span class="scorebar"><i style="width:${Math.min(100, 100*c.score/max)}%"></i></span>
        <span class="chip">檢索分 ${c.score.toFixed(2)}</span>
        <button class="mini" onclick="handoff('${esc(c.song_id)}')">設為正在播放（串燒）</button>
      </div>
      ${c.evidence.map(ev => `
        <div class="ev">
          <div class="row"><span class="who">A</span>
            <span class="time">${mmss(ev.a_time)}</span>
            ${ev.a_text.startsWith("《") ? "" : pbtn(r.query, ev.a_time)}
            <span>${esc(ev.a_text)}</span></div>
          ${metaChips(ev.a_meta, "A 出點：")}
          <div class="row" style="margin-top:4px"><span class="who">B</span>
            <span class="time">${mmss(ev.b_time)}</span>
            ${ev.b_is_title ? "" : pbtn(c.song_id, ev.b_time)}
            <span>${esc(ev.b_text)}</span></div>
          ${metaChips(ev.b_meta, "B 進點：")}
          <div class="meta">
            <span class="chip anchor">錨點「${esc(ev.anchor)}」</span>
            <span class="chip">${esc(ev.anchor_label)}</span>
            ${ev.a_spread >= 2 ? `<span class="chip recog">A的語意·${ev.a_spread}句/${ev.a_sat}次</span>`
              : (ev.a_sat >= 3 ? `<span class="chip">A單句loop${ev.a_sat}次</span>` : "")}
            <span class="chip recog">B句：${esc(ev.b_label)}</span>
            <span class="chip">pair ${ev.score.toFixed(2)}</span>
            ${mixbtn(r.query, ev.a_meta && ev.a_meta.line_end, c.song_id,
                     ev.b_is_title ? null : ev.b_time,
                     ev.a_text, ev.b_text, true)}
          </div>
        </div>`).join("")}
    </div>`).join("");
}

function renderJudge(j) {
  const box = document.getElementById("judge");
  if (j.error) {
    box.innerHTML = `<div class="judge"><h3>STAGE 2 · GEMINI 裁判</h3>
      <div>${esc(j.error)}</div></div>`;
    return;
  }
  const g = j.judge, bId = g._next_song_id;
  const fl = g.from_line || {}, el = g.enter_line || {};
  box.innerHTML = `
    <div class="judge">
      <h3>STAGE 2 · GEMINI 裁判</h3>
      <div class="verdict">下一首：《${esc(g.next_song)}》
        <span class="anchor">「${esc(g.anchor)}」</span>
        <span class="chip">${esc(g.type)}</span>
        <span class="conf ${esc(g.confidence)}">${esc(g.confidence)}</span>
      </div>
      <div class="jline">A 出點 <span class="time">${esc(fl.time)}</span>
        ${fl.sec != null ? pbtn(j.query, fl.sec) : ""} 「${esc(fl.text)}」</div>
      <div class="jline">B 進點 <span class="time">${esc(el.time)}</span>
        ${bId && el.sec != null ? pbtn(bId, el.sec) : ""} 「${esc(el.text)}」</div>
      ${metaChips(g._b_meta, "B 進點：")}
      <div style="margin:10px 0">
        ${mixbtn(j.query,
                 (g._a_meta && g._a_meta.line_end) ??
                   (fl.sec != null ? fl.sec + 4 : null),
                 bId, el.sec, fl.text, el.text, false)}
      </div>
      <div class="why">${esc(g.why)}</div>
      ${bId ? `<div style="margin-top:10px">
        <button class="mini" onclick="handoff('${esc(bId)}')">採用裁判結果，設《${esc(bId)}》為正在播放</button>
      </div>` : ""}
      ${(g.runner_ups || []).length ? `<div class="runner">備選：${
        g.runner_ups.map(r => `《${esc(r.song)}》錨點「${esc(r.anchor)}」— ${esc(r.why)}`)
          .join("；")}</div>` : ""}
    </div>`;
}

function handoff(next) {
  if (NOW) PLAYED.push(NOW);
  preview.pause();
  pick(next);
  doRetrieve();
}

/* ── offset calibration — per audio FILE, so A and B each need their own ── */
let CAL_SONG = null;
function songMeta(id) { return SONGS.find(s => s.id === id); }
function toggleCal() { calFor(NOW); }
function calFor(id) {
  const p = document.getElementById("calPanel");
  if (CAL_SONG === id && p.style.display !== "none") {
    p.style.display = "none"; return;
  }
  CAL_SONG = id;
  p.style.display = "block";
  document.getElementById("calMsg").textContent = "";
  renderCal();
}
function renderCal() {
  const s = songMeta(CAL_SONG);
  if (!s) return;
  document.getElementById("calSong").textContent = "《" + s.title + "》";
  document.getElementById("calText").textContent = s.cal.text;
  const o = off(CAL_SONG);
  document.getElementById("calOff").textContent =
    (o >= 0 ? "+" : "") + o.toFixed(1) + "s";
}
function calAdj(d) {
  OFFSETS[CAL_SONG] = Math.round(((OFFSETS[CAL_SONG] || 0) + d) * 10) / 10;
  renderCal();
  calPlay(null);
}
function calPlay(btn) {
  const s = songMeta(CAL_SONG);
  if (s) playAt(CAL_SONG, s.cal.time, btn);
}
async function calSave() {
  const r = await (await fetch(
    `/api/set_offset?song=${encodeURIComponent(CAL_SONG)}` +
    `&offset=${off(CAL_SONG)}`)).json();
  document.getElementById("calMsg").textContent =
    r.ok ? "已儲存 ✓（之後所有播放與試聽接歌都會套用）" : ("失敗: " + r.error);
  loadSongs();
}

loadSongs();
</script>
